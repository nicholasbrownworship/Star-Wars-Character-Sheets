<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FFG Star Wars Character Tracker</title>

  <!-- FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- STYLES -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="starfield"></canvas>

  <div class="app">
    <!-- SIDEBAR / CHARACTER LIST -->
    <aside class="panel datapad">
      <header>
        <div class="logo">SW</div>
        <div>
          <h1>FFG Character Tracker</h1>
          <div class="meta">Local-only · export/import JSON · printable</div>
        </div>
      </header>

      <div class="controls" style="margin-top:12px">
        <button id="newBtn">New</button>
        <button id="duplicateBtn">Duplicate</button>
        <button id="deleteBtn">Delete</button>
        <button id="exportBtn">Export</button>
        <button id="importBtn">Import</button>
        <input id="importFile" type="file" accept="application/json" style="display:none" />
      </div>

      <div class="character-list" id="charList"></div>

      <div style="margin-top:12px;border-top:1px solid rgba(255,255,255,0.03);padding-top:12px">
        <div class="meta">Quick actions</div>
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
          <button id="seedBtn">Load Sample</button>
          <button id="clearAllBtn">Clear All</button>
          <button id="printBtn">Print Sheet</button>
        </div>
      </div>
    </aside>

    <!-- MAIN PANEL / EDITOR -->
    <main class="panel datapad">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div class="meta">Editing</div>
          <div id="charNameDisplay" style="font-size:20px">— select a character —</div>
        </div>
        <div class="actions">
          <button id="saveBtn">Save</button>
        </div>
      </div>

      <div id="editorForm" style="display:none" class="editor">
        <div class="row">
          <div class="col">
            <label>Name</label>
            <input id="name" type="text" placeholder="Character name" />
          </div>
          <div style="width:190px">
            <label>Species</label>
            <input id="species" type="text" placeholder="Human / Twi'lek" />
          </div>
          <div style="width:220px">
            <label>Career / Role</label>
            <input id="career" type="text" placeholder="Smuggler / Bounty Hunter" />
          </div>
        </div>

        <div>
          <label>Motivation / Notes</label>
          <textarea id="notes" rows="3"></textarea>
        </div>

        <div>
          <label>Characteristics</label>
          <div class="stat-grid" id="stats"></div>
        </div>

        <div style="display:flex;gap:12px">
          <div style="flex:1">
            <label>Wounds</label>
            <input id="wounds" type="number" min="0" />
          </div>
          <div style="flex:1">
            <label>Strain</label>
            <input id="strain" type="number" min="0" />
          </div>
          <div style="flex:1">
            <label>Soak</label>
            <input id="soak" type="number" min="0" />
          </div>
          <div style="flex:1">
            <label>Defense</label>
            <input id="defense" type="number" min="0" />
          </div>
        </div>

        <div>
          <label>Gear / Equipment</label>
          <input id="gear" type="text" placeholder="Blaster, Lightsaber, Armor..." />
        </div>

        <div>
          <label>Skills</label>
          <div class="skills" id="skillList"></div>
        </div>

        <!-- DICE ROLLER -->
        <div class="dice-roller">
          <label>Dice Roller</label>
          <div class="dice-controls">
            <label>Ability
              <input type="number" min="0" id="diceAbility">
            </label>
            <label>Proficiency
              <input type="number" min="0" id="diceProficiency">
            </label>
            <label>Boost
              <input type="number" min="0" id="diceBoost">
            </label>
            <label>Difficulty
              <input type="number" min="0" id="diceDifficulty">
            </label>
            <label>Challenge
              <input type="number" min="0" id="diceChallenge">
            </label>
            <label>Setback
              <input type="number" min="0" id="diceSetback">
            </label>
            <label>Force
              <input type="number" min="0" id="diceForce">
            </label>
          </div>

          <div style="margin-top:6px; display:flex; gap:6px; flex-wrap:wrap">
            <button id="rollDiceBtn">Roll</button>
            <button id="clearDiceBtn">Clear</button>
            <button class="negativeDiceBtn" data-type="difficulty">+Difficulty (Purple)</button>
            <button class="negativeDiceBtn" data-type="challenge">+Challenge (Red)</button>
            <button class="negativeDiceBtn" data-type="setback">+Setback (Black)</button>
          </div>

          <div class="dice-result" id="diceResult"></div>
          <div class="dice-result" id="netResult" style="margin-top:6px"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- SCRIPT -->
  <script src="script.js"></script>
</body>
</html>
